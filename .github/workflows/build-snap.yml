name: Build ctrlX HMI snap (arm64)

# Builds the arm64 .snap for the physical ctrlX OS device. Runs on a normal amd64
# GitHub runner and cross-builds via QEMU (diddlesnaps/snapcraft-multiarch-action),
# so no local LXD/build VM is needed. Download the .snap from the run's artifacts.

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Build snap for arm64
        uses: diddlesnaps/snapcraft-multiarch-action@v1
        with:
          architecture: arm64
          path: backend          # snapcraft.yaml lives in backend/

      - name: Upload arm64 snap
        uses: actions/upload-artifact@v4
        with:
          name: ctrlx-hmi-app-arm64-snap
          path: backend/*.snap
          if-no-files-found: error
