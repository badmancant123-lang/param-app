name: Build ctrlX HMI snap (arm64)

# Builds the arm64 .snap for the physical ctrlX OS device (base: core24).
# Uses a native arm64 GitHub runner + the official Snapcraft action (current snapcraft,
# supports core24, no QEMU). Download the .snap from the run's artifacts.

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm      # native arm64 runner → produces an arm64 snap
    steps:
      - uses: actions/checkout@v4

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build
        with:
          path: backend            # snapcraft.yaml lives in backend/

      - name: Upload arm64 snap
        uses: actions/upload-artifact@v4
        with:
          name: ctrlx-hmi-app-arm64-snap
          path: backend/*.snap
          if-no-files-found: error
